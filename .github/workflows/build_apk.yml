name: Build & Release YA Trip Challenge APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_abi_split:
        description: 'Gerar versões divididas por dispositivo (modernos/antigos)?'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APKs (Modernos, Antigos e Universal)
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar o repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar o Java 17 (compatível com Gradle / AGP do projeto)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Configurar o ambiente Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      # 4. Verificar versões das ferramentas
      - name: Flutter Doctor
        run: flutter doctor -v

      # 5. Instalar dependências do projeto
      - name: Install dependencies
        run: flutter pub get

      # 6. Validação estática de código (Linter / Analyzer)
      - name: Analyze code
        run: flutter analyze

      # 7. Compilar APK Universal (compatível com todos os dispositivos)
      - name: Build Universal Release APK
        run: |
          mkdir -p output-apks/universal
          echo "Compilando APK Universal..."
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk output-apks/universal/ya_trip_challenge-universal.apk

      # 8. Compilar APKs Divididos por Arquitetura (Modernos arm64, Antigos arm32, Emuladores x86_64)
      - name: Build Split-per-ABI APKs (Modernos e Antigos)
        run: |
          echo "Compilando APKs otimizados por dispositivo..."
          flutter build apk --release --split-per-abi

          mkdir -p output-apks/modernos
          mkdir -p output-apks/antigos
          mkdir -p output-apks/emuladores

          # arm64-v8a: Dispositivos Modernos (64 bits - celulares recentes)
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output-apks/modernos/ya_trip_challenge-dispositivos-modernos-arm64.apk
          fi

          # armeabi-v7a: Dispositivos Antigos / Básicos (32 bits)
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output-apks/antigos/ya_trip_challenge-dispositivos-antigos-arm32.apk
          fi

          # x86_64: Emuladores PC e tablets Intel/AMD
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk output-apks/emuladores/ya_trip_challenge-emuladores-x86_64.apk
          fi

      # 9. Artefato Separado: Dispositivos Modernos (ARM64-v8a)
      - name: Upload Modernos (ARM64) APK
        uses: actions/upload-artifact@v4
        with:
          name: ya_trip_challenge-dispositivos-modernos-arm64
          path: output-apks/modernos/*.apk
          retention-days: 14

      # 10. Artefato Separado: Dispositivos Antigos (ARMeabi-v7a)
      - name: Upload Antigos (ARM32) APK
        uses: actions/upload-artifact@v4
        with:
          name: ya_trip_challenge-dispositivos-antigos-arm32
          path: output-apks/antigos/*.apk
          retention-days: 14

      # 11. Artefato Separado: Versão Universal (Todos os aparelhos)
      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: ya_trip_challenge-universal-todos-aparelhos
          path: output-apks/universal/*.apk
          retention-days: 14

      # 12. Artefato Separado: Emuladores e PCs (x86_64)
      - name: Upload Emuladores (x86_64) APK
        uses: actions/upload-artifact@v4
        with:
          name: ya_trip_challenge-emuladores-x86_64
          path: output-apks/emuladores/*.apk
          retention-days: 14

      # 13. Criar Release automática no GitHub quando uma tag for criada (ex: v1.0.0)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output-apks/modernos/*.apk
            output-apks/antigos/*.apk
            output-apks/universal/*.apk
            output-apks/emuladores/*.apk
          name: YA Trip Challenge Release ${{ github.ref_name }}
          body: |
            ## YA Trip Challenge - Release ${{ github.ref_name }}
            
            Artefatos APK compilados automaticamente pelo GitHub Actions:
            
            - 📱 **Dispositivos Modernos (64-bit)**: `ya_trip_challenge-dispositivos-modernos-arm64.apk` (Smartphones recentes, APK mais leve e rápido)
            - 📲 **Dispositivos Antigos (32-bit)**: `ya_trip_challenge-dispositivos-antigos-arm32.apk` (Smartphones antigos e básicos)
            - 🌐 **Versão Universal**: `ya_trip_challenge-universal.apk` (Funciona em qualquer aparelho Android)
            - 💻 **Emuladores / PC**: `ya_trip_challenge-emuladores-x86_64.apk` (Para emulação no PC)
            
            - **Aplicação:** YA Trip Challenge
            - **Package:** `com.tivane.ya_trip_challenge`
            - **Commit:** `${{ github.sha }}`
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
